openapi: 3.2.0
info:
  title: SAP Sales and Distribution (SD) SAP Outbound Delivery…
  description: Create and manage outbound deliveries, goods issue, and shipping documents in SAP S/4HANA. This OData service (API_OUTBOUND_DELIVERY_SRV) supports delivery creation with reference to sales orders, picking confirmation, goods issue posting, and subsequent logistics processing. Part of the Delivery Processing Integration (SAP_COM_0106) communication scenario.
  version: 1.0.0
  contact:
    name: SAP Support
    url: https://support.sap.com
  license:
    name: SAP Developer License
    url: https://www.sap.com/about/agreements/product-use-and-support-terms.html
servers:
- url: https://sandbox.api.sap.com/s4hanacloud/sap/opu/odata/sap/API_OUTBOUND_DELIVERY_SRV
  description: SAP S/4HANA Cloud Sandbox
- url: https://{host}:{port}/sap/opu/odata/sap/API_OUTBOUND_DELIVERY_SRV
  description: SAP S/4HANA On-Premise
  variables:
    host:
      default: localhost
    port:
      default: '443'
security:
- basicAuth: []
- oauth2: []
tags:
- name: Outbound Delivery Partner
  description: Operations on outbound delivery partners (A_OutbDeliveryPartner)
paths:
  /A_OutbDeliveryHeader('{DeliveryDocument}')/to_DeliveryDocumentPartner:
    get:
      operationId: listOutboundDeliveryPartners
      summary: Retrieve partners for an outbound delivery
      description: Returns a collection of business partners associated with the delivery.
      tags:
      - Outbound Delivery Partner
      parameters:
      - name: DeliveryDocument
        in: path
        required: true
        description: Delivery document number
        schema:
          type: string
          maxLength: 10
      - $ref: '#/components/parameters/top'
      - $ref: '#/components/parameters/skip'
      - $ref: '#/components/parameters/select'
      responses:
        '200':
          description: Successfully retrieved delivery partners
          content:
            application/json:
              schema:
                type: object
                properties:
                  d:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/OutbDeliveryPartner'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    OutbDeliveryPartner:
      type: object
      description: Outbound delivery partner entity (A_OutbDeliveryPartner)
      properties:
        PartnerFunction:
          type: string
          maxLength: 2
          description: Partner function
        SDDocument:
          type: string
          maxLength: 10
          description: Delivery document number
        Customer:
          type: string
          maxLength: 10
          description: Customer number
        Supplier:
          type: string
          maxLength: 10
          description: Vendor account number
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: object
              properties:
                lang:
                  type: string
                value:
                  type: string
  parameters:
    skip:
      name: $skip
      in: query
      description: Number of records to skip
      schema:
        type: integer
        minimum: 0
    top:
      name: $top
      in: query
      description: Maximum number of records to return
      schema:
        type: integer
        minimum: 0
    select:
      name: $select
      in: query
      description: Comma-separated properties to include
      schema:
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{tenant}.authentication.{landscape}.hana.ondemand.com/oauth/token
          scopes:
            API_OUTBOUND_DELIVERY_SRV: Access to Outbound Delivery API
