openapi: 3.2.0
info:
  title: SAP Sales and Distribution (SD) SAP Sales Quotation Sales…
  description: Create, read, update, and delete sales quotations in SAP S/4HANA. This OData service (API_SALES_QUOTATION_SRV) supports the complete quotation lifecycle from creation through approval and conversion to sales orders. Quotations include header, item, partner, pricing element, and text entities.
  version: 1.0.0
  contact:
    name: SAP Support
    url: https://support.sap.com
  license:
    name: SAP Developer License
    url: https://www.sap.com/about/agreements/product-use-and-support-terms.html
servers:
- url: https://sandbox.api.sap.com/s4hanacloud/sap/opu/odata/sap/API_SALES_QUOTATION_SRV
  description: SAP S/4HANA Cloud Sandbox
- url: https://{host}:{port}/sap/opu/odata/sap/API_SALES_QUOTATION_SRV
  description: SAP S/4HANA On-Premise
  variables:
    host:
      default: localhost
    port:
      default: '443'
security:
- basicAuth: []
- oauth2: []
tags:
- name: Sales Quotation Item
  description: Operations on sales quotation items (A_SalesQuotationItem)
paths:
  /A_SalesQuotation('{SalesQuotation}')/to_Item:
    get:
      operationId: listSalesQuotationItems
      summary: Retrieve items for a sales quotation
      description: Returns a collection of line items for the specified sales quotation.
      tags:
      - Sales Quotation Item
      parameters:
      - name: SalesQuotation
        in: path
        required: true
        description: Sales quotation number
        schema:
          type: string
          maxLength: 10
      - $ref: '#/components/parameters/top'
      - $ref: '#/components/parameters/skip'
      - $ref: '#/components/parameters/select'
      responses:
        '200':
          description: Successfully retrieved quotation items
          content:
            application/json:
              schema:
                type: object
                properties:
                  d:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/SalesQuotationItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    skip:
      name: $skip
      in: query
      description: Number of records to skip
      schema:
        type: integer
        minimum: 0
    top:
      name: $top
      in: query
      description: Maximum number of records to return
      schema:
        type: integer
        minimum: 0
    select:
      name: $select
      in: query
      description: Comma-separated properties to include
      schema:
        type: string
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: object
              properties:
                lang:
                  type: string
                value:
                  type: string
    SalesQuotationItem:
      type: object
      description: Sales quotation item entity (A_SalesQuotationItem)
      properties:
        SalesQuotation:
          type: string
          maxLength: 10
          description: Sales quotation number
        SalesQuotationItem:
          type: string
          maxLength: 6
          description: Item number
        SalesQuotationItemCategory:
          type: string
          maxLength: 4
          description: Item category
        SalesQuotationItemText:
          type: string
          maxLength: 40
          description: Item description
        Material:
          type: string
          maxLength: 40
          description: Material number
        RequestedQuantity:
          type: string
          description: Order quantity
        RequestedQuantityUnit:
          type: string
          maxLength: 3
          description: Sales unit
        NetAmount:
          type: string
          description: Net value
        TransactionCurrency:
          type: string
          maxLength: 5
          description: Document currency
        MaterialGroup:
          type: string
          maxLength: 9
          description: Material group
        Plant:
          type: string
          maxLength: 4
          description: Plant
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{tenant}.authentication.{landscape}.hana.ondemand.com/oauth/token
          scopes:
            API_SALES_QUOTATION_SRV: Access to Sales Quotation API
