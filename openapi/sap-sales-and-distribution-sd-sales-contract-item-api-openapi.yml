openapi: 3.2.0
info:
  title: SAP Sales and Distribution (SD) SAP Sales Contract Sales…
  description: Create and manage sales contracts including quantity contracts and value contracts in SAP S/4HANA. This OData service (API_SALES_CONTRACT_SRV) supports contract lifecycle management from creation through fulfillment tracking, including header, item, partner, and pricing element entities.
  version: 1.0.0
  contact:
    name: SAP Support
    url: https://support.sap.com
  license:
    name: SAP Developer License
    url: https://www.sap.com/about/agreements/product-use-and-support-terms.html
servers:
- url: https://sandbox.api.sap.com/s4hanacloud/sap/opu/odata/sap/API_SALES_CONTRACT_SRV
  description: SAP S/4HANA Cloud Sandbox
- url: https://{host}:{port}/sap/opu/odata/sap/API_SALES_CONTRACT_SRV
  description: SAP S/4HANA On-Premise
  variables:
    host:
      default: localhost
    port:
      default: '443'
security:
- basicAuth: []
- oauth2: []
tags:
- name: Sales Contract Item
  description: Operations on sales contract items (A_SalesContractItem)
paths:
  /A_SalesContract('{SalesContract}')/to_Item:
    get:
      operationId: listSalesContractItems
      summary: Retrieve items for a sales contract
      description: Returns a collection of line items for the specified sales contract.
      tags:
      - Sales Contract Item
      parameters:
      - name: SalesContract
        in: path
        required: true
        description: Sales contract number
        schema:
          type: string
          maxLength: 10
      - $ref: '#/components/parameters/top'
      - $ref: '#/components/parameters/skip'
      - $ref: '#/components/parameters/select'
      responses:
        '200':
          description: Successfully retrieved contract items
          content:
            application/json:
              schema:
                type: object
                properties:
                  d:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/SalesContractItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    skip:
      name: $skip
      in: query
      schema:
        type: integer
        minimum: 0
    top:
      name: $top
      in: query
      schema:
        type: integer
        minimum: 0
    select:
      name: $select
      in: query
      schema:
        type: string
  schemas:
    SalesContractItem:
      type: object
      description: Sales contract item entity (A_SalesContractItem)
      properties:
        SalesContract:
          type: string
          maxLength: 10
          description: Sales contract number
        SalesContractItem:
          type: string
          maxLength: 6
          description: Item number
        SalesContractItemCategory:
          type: string
          maxLength: 4
          description: Item category
        Material:
          type: string
          maxLength: 40
          description: Material number
        TargetQuantity:
          type: string
          description: Target quantity
        TargetQuantityUnit:
          type: string
          maxLength: 3
          description: Target quantity unit
        NetAmount:
          type: string
          description: Net value
        TransactionCurrency:
          type: string
          maxLength: 5
          description: Document currency
        Plant:
          type: string
          maxLength: 4
          description: Plant
        MaterialGroup:
          type: string
          maxLength: 9
          description: Material group
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: object
              properties:
                lang:
                  type: string
                value:
                  type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{tenant}.authentication.{landscape}.hana.ondemand.com/oauth/token
          scopes:
            API_SALES_CONTRACT_SRV: Access to Sales Contract API
